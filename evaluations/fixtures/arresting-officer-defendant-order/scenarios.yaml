schema_version: 1
scenarios:
  - id: one-arresting-officer
    arrest_involved: true
    arresting_officers:
      - Officer Rivera
    designated_primary: null
    caller_defendant_order:
      - City of Example
      - Officer Rivera
      - Officer Jones
    required_presentations:
      - caption
      - parties
      - defendant_list
      - defendant_grouped_claims
    expected_chronology:
      - Officer Jones arrived.
      - Officer Rivera made the arrest decision.
    passing_candidate:
      outcome: filing
      defendant_presentations:
        caption:
          - Officer Rivera
          - City of Example
          - Officer Jones
        parties:
          - Officer Rivera
          - City of Example
          - Officer Jones
        defendant_list:
          - Officer Rivera
          - City of Example
          - Officer Jones
        defendant_grouped_claims:
          - Officer Rivera
          - City of Example
          - Officer Jones
      factual_chronology:
        - Officer Jones arrived.
        - Officer Rivera made the arrest decision.
    regressions:
      - id: city-remains-first
        candidate:
          outcome: filing
          defendant_presentations:
            caption:
              - City of Example
              - Officer Rivera
            parties:
              - City of Example
              - Officer Rivera
            defendant_list:
              - City of Example
              - Officer Rivera
            defendant_grouped_claims:
              - City of Example
              - Officer Rivera
          factual_chronology:
            - Officer Jones arrived.
            - Officer Rivera made the arrest decision.
        expected_findings:
          - primary-not-first:caption
          - primary-not-first:defendant_grouped_claims
          - primary-not-first:defendant_list
          - primary-not-first:parties
      - id: chronology-reordered-to-match-defendants
        candidate:
          outcome: filing
          defendant_presentations:
            caption:
              - Officer Rivera
            parties:
              - Officer Rivera
            defendant_list:
              - Officer Rivera
            defendant_grouped_claims:
              - Officer Rivera
          factual_chronology:
            - Officer Rivera made the arrest decision.
            - Officer Jones arrived.
        expected_findings:
          - chronology-reordered

