name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run validate
      - name: Add evaluation summary
        if: ${{ always() && hashFiles('evaluations/corpus-report.md') != '' }}
        run: cat evaluations/corpus-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evaluation report
        if: ${{ always() && hashFiles('evaluations/corpus-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: drafting-skill-evaluation
          path: evaluations/corpus-report.json
